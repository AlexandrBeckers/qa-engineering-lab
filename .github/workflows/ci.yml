name: QA checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/docker-compose

jobs:
  test:
    name: Lint and API regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create CI environment files
        run: |
          printf '%s\n' \
            'BASE_URL=http://127.0.0.1:8001' \
            'REQUEST_TIMEOUT=10' \
            'DB_HOST=127.0.0.1' \
            'DB_PORT=5433' \
            'DB_NAME=ecommerce_db' \
            'DB_USER=postgres' \
            'DB_PASSWORD=qa-ci-password' > .env

          printf '%s\n' \
            'POSTGRES_DB=ecommerce_db' \
            'POSTGRES_USER=postgres' \
            'POSTGRES_PASSWORD=qa-ci-password' \
            'DB_HOST=ecommerce_db' \
            'DB_PORT=5432' \
            'DJANGO_SECRET_KEY=ci-only-secret-key' \
            'DJANGO_DEBUG=True' \
            'DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0' \
            'JWT_SECRET_KEY=ci-only-jwt-secret-key' \
            'EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend' > external/ecommerce/.env

      - name: Start PostgreSQL
        run: |
          docker compose -f external/ecommerce/docker-compose.yml up -d --build ecommerce_db

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker compose -f external/ecommerce/docker-compose.yml exec -T ecommerce_db \
              pg_isready -U postgres -d ecommerce_db; then
              exit 0
            fi
            sleep 2
          done

          docker compose -f external/ecommerce/docker-compose.yml logs ecommerce_db
          exit 1

      - name: Apply Django migrations
        run: |
          docker compose -f external/ecommerce/docker-compose.yml run --rm ecommerce_django \
            python manage.py migrate --noinput

      - name: Start Django API
        run: |
          docker compose -f external/ecommerce/docker-compose.yml up -d ecommerce_django

      - name: Wait for API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8001/api/products/; then
              exit 0
            fi
            sleep 2
          done

          docker compose -f external/ecommerce/docker-compose.yml logs
          exit 1

      - name: Run Django checks
        run: |
          docker compose -f external/ecommerce/docker-compose.yml exec -T ecommerce_django \
            python manage.py check

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run API and database tests
        run: python -m pytest

      - name: Stop test environment
        if: always()
        run: |
          docker compose -f external/ecommerce/docker-compose.yml down -v --remove-orphans
